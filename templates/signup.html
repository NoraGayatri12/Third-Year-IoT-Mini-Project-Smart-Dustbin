<!DOCTYPE html>
<html>
<head>
    <title>Smart Dustbin | Sign Up</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #3498db, #2c3e50);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 15px;
            width: 350px;
            color: white;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        h1 {
            margin-bottom: 5px;
        }

        .quote {
            font-size: 14px;
            margin-bottom: 25px;
            opacity: 0.8;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            outline: none;
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #3498db;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #2980b9;
        }

        a {
            color: #3498db;
            text-decoration: none;
        }

        .footer {
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>🗑 Smart Dustbin</h1>
    <p class="quote">"Join the smart waste management revolution."</p>

    <form method="POST">

        <input type="text" name="username" placeholder="Choose Username" required>

        <input type="email" name="email" placeholder="Enter Email" required>

        <input type="password" name="password" placeholder="Choose Password" required>

        <select name="role" required>
            <option value="">Select Role</option>
            <option value="HOD">HOD</option>
            <option value="Department Head">Department Head</option>
            <option value="Cleaner Staff">Cleaner Staff</option>
        </select>

        <button type="submit">Create Account</button>
    </form>

    <div class="footer">
        Already have an account? <a href="/login">Login</a>
    </div>
</div>

</body>
</html>
